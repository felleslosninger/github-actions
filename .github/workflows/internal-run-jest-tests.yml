name: Run Jest Tests

on:
  pull_request:
    paths:
      - "write-to-influxdb/**"
      - "publish-release-notes/**"
      - "get-release-notes/**"
      # Add more folders as needed
  push:
    branches:
      - main
    paths:
      - "write-to-influxdb/**"
      - "publish-release-notes/**"
      - "get-release-notes/**"
      # Add more folders as needed

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        folder:
          - "write-to-influxdb"
          - "publish-release-notes"
          - "get-release-notes"
          # Add more folders as needed

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          submodules: "true"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version-file: .node-version
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
          cache: npm

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{ matrix.folder }}

      - run: npm run test
        working-directory: ${{ matrix.folder }}
