name: Lint Codebase

on:
  pull_request:
    paths:
      - "write-to-influxdb/**"
      - "publish-release-notes/**"
      - "get-release-notes/**"
      # Add more folders as needed
  push:
    branches:
      - main
    paths:
      - "write-to-influxdb/**"
      - "publish-release-notes/**"
      - "get-release-notes/**"
      # Add more folders as needed

permissions:
  contents: read

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    strategy:
      matrix:
        folder:
          - "write-to-influxdb"
          - "publish-release-notes"
          - "get-release-notes"
          # Add more folders as needed

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin@v7.1.0
        with:
          node-version-file: .node-version
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
          cache: npm

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{ matrix.folder }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.folder }}

      - name: Check Formatting
        run: npm run format:check
        working-directory: ${{ matrix.folder }}
